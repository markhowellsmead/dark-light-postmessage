<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Receiving messages using postMessage</title>
        <script>
            const initialThemeStorageKey = "theme";

            const getStoredTheme = () => {
                try {
                    return sessionStorage.getItem(initialThemeStorageKey) ===
                        "dark"
                        ? "dark"
                        : "light";
                } catch {
                    return "light";
                }
            };

            document.documentElement.classList.add(`theme-${getStoredTheme()}`);
        </script>
        <style>
            html.theme-light {
                color-scheme: light;
                background: #f6f7fb;
                color: #1f2937;
            }

            html.theme-dark {
                color-scheme: dark;
                background: #111827;
                color: #e5e7eb;
            }

            body {
                margin: 0;
                padding: 24px;
                font-family: system-ui, sans-serif;
                background: inherit;
                color: inherit;
            }

            textarea {
                display: block;
                width: 100%;
                max-width: 640px;
                margin-top: 16px;
                padding: 12px;
                border: 1px solid currentColor;
                border-radius: 8px;
                background: transparent;
                color: inherit;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <p>This is the content of the iframe.</p>

        <textarea id="myTextarea" rows="4" cols="50">
        This is a sample text inside the textarea.
    </textarea
        >

        <script>
            const textarea = document.getElementById("myTextarea");
            const themeStorageKey = "theme";

            const setStoredTheme = theme => {
                try {
                    sessionStorage.setItem(themeStorageKey, theme);
                } catch {
                    // Ignore storage failures.
                }
            };

            const applyTheme = theme => {
                document.documentElement.classList.toggle(
                    "theme-dark",
                    theme === "dark",
                );
                document.documentElement.classList.toggle(
                    "theme-light",
                    theme !== "dark",
                );
                setStoredTheme(theme);
            };

            window.addEventListener("message", event => {
                const message = event.data;

                console.log("Received message from parent:", message);

                const nextValue =
                    typeof message === "string"
                        ? message
                        : message && typeof message === "object"
                          ? message.type === "theme"
                              ? null
                              : (message.content ??
                                message.text ??
                                message.value)
                          : null;

                if (
                    message &&
                    typeof message === "object" &&
                    message.type === "theme"
                ) {
                    applyTheme(message.theme);
                }

                if (typeof nextValue === "string") {
                    textarea.value = nextValue;
                }
            });
        </script>
    </body>
</html>
